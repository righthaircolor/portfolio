name: Собрать сайт из Notion

on:
  workflow_dispatch:          # кнопка «Run workflow» — обновить сайт прямо сейчас
  schedule:
    - cron: '17 * * * *'      # и сам раз в час
  push:
    branches: [main]
  delete:                     # ветку удалили — её превью исчезает
  # Пуш в любую другую ветку запускает эту сборку через preview.yml:
  # собирается сайт из main и превью всех веток в preview/<ветка>/.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: scripts/build-all.sh
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
