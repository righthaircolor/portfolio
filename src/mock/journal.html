<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Кейсы и наблюдения — макет</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../style.css">
<script>document.documentElement.classList.add('js')</script>
<style>
/* Макет: левая колонка — оглавление, правая — лента превью */
.j-head{display:grid;grid-template-columns:var(--left) minmax(0,1fr);column-gap:var(--gap);align-items:end;padding:8px 0 24px;border-bottom:.5px solid var(--line)}
.j-head .site-name{justify-self:start}
.j-head .bar{display:flex;justify-content:space-between;gap:24px}
.j{display:grid;grid-template-columns:var(--left) minmax(0,1fr);column-gap:var(--gap);align-items:start}
.j-index{position:sticky;top:0;max-height:100vh;overflow:auto;padding:var(--s-top) var(--gap) var(--s-top) 0;scrollbar-width:none}
.j-index::-webkit-scrollbar{display:none}
.j-lead{font-size:24px;line-height:1.18;max-width:420px}
.j-rubrics{list-style:none;padding:0;margin-top:var(--s-group);display:flex;flex-wrap:wrap;gap:var(--s-list) var(--s-group)}
.j-rubrics a{text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
.j-rubrics a:hover,.j-rubrics a[aria-current]{color:var(--ink)}
.j-rubrics .n{font-size:11px;letter-spacing:0;position:relative;top:-.55em;margin-left:1px}
.j-list{list-style:none;padding:var(--s-rule) 0 0;margin-top:var(--s-group);border-top:.5px solid var(--line);display:grid;gap:var(--s-para);max-width:420px}
.j-list a{display:block;color:var(--muted);transition:color .2s}
.j-list a:hover,.j-list a.is-current{color:var(--ink)}
.j-list .src{display:block;font-size:13px;margin-top:2px}
.j-feed{padding-top:var(--s-top);min-width:0;display:flex;flex-direction:column;gap:var(--s-block)}
.card{scroll-margin-top:var(--s-top)}
.card{border-top:.5px solid var(--line);padding-top:var(--s-rule)}
.card .row{display:grid;grid-template-columns:38% 62%;margin-top:var(--s-para)}
.card .row:first-child{margin-top:0}
.card h2{font-size:16px;font-weight:400;padding-right:24px}
.card .src{color:var(--muted);font-size:14px;margin-top:4px}
.card .sum{max-width:620px}
.card .go{display:inline-block;margin-top:var(--s-para)}
.card .go:hover,.card h2 a:hover{text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:4px}
.card figure{margin:0 0 var(--s-para)}
.card img{display:block;max-width:100%;max-height:440px;width:auto;height:auto}
.card[hidden],.j-list li[hidden]{display:none}
.mock-note{position:fixed;right:16px;bottom:16px;background:var(--ink);color:#fff;font-size:12px;padding:6px 10px;z-index:5}
@media (max-width:600px){
  .j-head{display:flex;justify-content:space-between}
  .j-head .bar span{display:none}
  .j{display:block}
  .j-index{position:static;max-height:none;overflow:visible;padding:28px 0 0}
  .j-lead{font-size:22px}
  .j-list{display:none}
  .j-feed{padding-top:28px;gap:40px}
  .card .row{grid-template-columns:1fr;row-gap:var(--s-list)}
  .card h2{padding:0}
}
</style>
</head>
<body class="journal-mock">
<header class="j-head">
 <a class="site-name" href="../">Ксения Анискович</a>
 <div class="bar"><span>Кейсы и наблюдения</span><a class="page-close" href="../" aria-label="Закрыть">×</a></div>
</header>
<main class="j">
 <aside class="j-index">
  <p class="j-lead">Тексты, исследования и разговоры о дизайне, брендах и культуре.</p>
  <ul class="j-rubrics" aria-label="Рубрики">
   <li><a href="#" data-r="" aria-current="true">Все <span class="n">11</span></a></li>
   <li><a href="#stati" data-r="stati">Статьи <span class="n">4</span></a></li>
   <li><a href="#keysy" data-r="keysy">Кейсы <span class="n">3</span></a></li>
   <li><a href="#dialogi" data-r="dialogi">Диалоги <span class="n">2</span></a></li>
   <li><a href="#zametki" data-r="zametki">Заметки <span class="n">2</span></a></li>
  </ul>
  <ol class="j-list" id="list"></ol>
 </aside>
 <div class="j-feed" id="feed"></div>
</main>
<p class="mock-note">Макет · не настоящий сайт</p>
<script>
const T = [
 ['stati','Конструктор миссии для бренда','vc.ru','https://vc.ru/marketing/2205037-konstruktor-missii-dlya-brenda','33','Авторская методология, которая помогает командам находить миссию в том, что действительно движет бизнесом.'],
 ['stati','О принципах и приемах дизайна в голландских плакатах','Skillbox Медиа','https://skillbox.ru/media/design/netherlands-posters/','26','Провела исследование и погрузилась внутрь культуры графического дизайна в Нидерландах. Для этой статьи Anthon Beeke Collective разрешили использовать работы дизайнера Антона Бейке.'],
 ['stati','Как выбрать респондентов для UX-исследования','Skillbox Медиа','https://skillbox.ru/media/design/vybiraem-respondentov-dlya-uxissledovaniya/','25','Пообщалась с разными дизайнерами и стратегом-аналитиком, как продуктовая команда проводит исследования внутри большого автомобильного классифайда.'],
 ['stati','Как по-дизайнерски откликнуться на вакансию','Блог Райт','https://right.by/blog/article/not-fun-cv-article/','','Собрала в кучу все замечания арт-директора, провела интервью и написала статью. Даже дополнительных согласований по тексту не понадобилось.'],
 ['dialogi','С ведущим дизайнером продукта av.by Ваней Звягиным','Кто студент','https://ktostudent.ru/vanja-zvjagin/','18','О принципах дизайнера, работе с Бирманом над схемой метро Минска и почему знания нужно применять в бою.'],
 ['dialogi','С арт-директором студии Райт Сашей Ревяко','Кто студент','https://ktostudent.ru/sasha-revjako-art-direktorstvo-porno-i-zadorno/','17','Каково это — создавать свою студию, когда вся команда вдруг остается без работы, куда смотреть при найме дизайнеров и почему перед учебой в Бюро нужен полевой опыт.'],
 ['keysy','Кейс о разработке интерфейса терминалов покупки билетов для Белорусской железной дороги','Студия Райт','https://right.by/projects/interface-belrailway/','24','Разработать интерфейс проще, чем написать кейс так, чтобы и потенциальным клиентам было понятно, и коммьюнити захватило.'],
 ['keysy','Кейс об упаковке для американского бренда органической еды','Студия Райт','https://right.by/projects/case-food-to-live/','','Писать о брендинге — это помнить об инфостиле, но выражать слова через эмоции.'],
 ['keysy','Кейс о стартапе, который разработал интуитивную клавиатуру с тачпадом','Студия Райт','https://right.by/projects/clevetura-site/','','Рассказ о технологии для клавиатур, вместе с которой не понадобится мышка.'],
 ['zametki','Заметка о процессе работы над заданием по типографике и верстке','Дзен','https://zen.yandex.ru/media/id/5d9a61de74f1bc00af82528f/kak-ia-delala-zadanie-po-verstke-na-vtoroi-stupeni-shkoly-rukovoditelei-5e3747845b4a3e23cf824dcd','22','Внутри текст и приятные картинки о процессе верстки одного экрана странички о себе для задания в Школе руководителей Бюро Горбунова.'],
 ['zametki','4 упражнения на креативность, чтобы писать нормальные подписи к иллюстрациям','Блог Райт','https://right.by/blog/article/captions-article/','','Заметка из комментариев в Гугл-доке о придумывании подписей. В процессе училась выходить из зоны комфорта инфостиля, искать ассоциации разного порядка и придумывать подписи «Спасибо, кэп». Последнее — не так-то просто.'],
];
const list = document.getElementById('list'), feed = document.getElementById('feed');
const ext = 'target="_blank" rel="noopener"';
T.forEach(([r, title, src, href, img, sum], i) => {
  list.insertAdjacentHTML('beforeend', `<li data-r="${r}"><a href="#t${i}" data-i="${i}">${title}<span class="src">${src} ↗</span></a></li>`);
  feed.insertAdjacentHTML('beforeend', `<article class="card" id="t${i}" data-r="${r}">
   <div class="row"><h2><a href="${href}" ${ext}>${title}</a><div class="src">${src}</div></h2>
   <div>${img ? `<figure><a href="${href}" ${ext}><img src="img/${img}.webp" alt=""></a></figure>` : ''}<p class="sum">${sum}</p><a class="go" href="${href}" ${ext}>Читать в «${src}» ↗</a></div></div>
  </article>`);
});
// Клик по названию слева — лента прокручивается к карточке.
list.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-i]'); if (!a) return;
  e.preventDefault();
  document.getElementById('t' + a.dataset.i).scrollIntoView({ behavior: 'smooth', block: 'start' });
});
// Подсветка текущего материала в оглавлении при прокрутке ленты.
const links = [...list.querySelectorAll('a')];
const spy = () => {
  const cards = [...feed.children].filter((c) => !c.hidden);
  let cur = cards[0];
  for (const c of cards) if (c.getBoundingClientRect().top < innerHeight * 0.35) cur = c;
  links.forEach((a) => a.classList.toggle('is-current', cur && a.getAttribute('href') === '#' + cur.id));
};
addEventListener('scroll', spy, { passive: true }); addEventListener('load', spy); spy();
// Рубрики — фильтр для оглавления и ленты.
document.querySelectorAll('.j-rubrics a').forEach((a) => a.addEventListener('click', (e) => {
  e.preventDefault();
  document.querySelectorAll('.j-rubrics a').forEach((x) => (x === a ? x.setAttribute('aria-current', 'true') : x.removeAttribute('aria-current')));
  const r = a.dataset.r;
  document.querySelectorAll('#list li, #feed .card').forEach((el) => { el.hidden = !!r && el.dataset.r !== r; });
  scrollTo({ top: 0 }); spy();
}));
</script>
</body>
</html>
